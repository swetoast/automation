Rules:
   Generate a compact natural‑language sentence suitable for an Android phone notification that summarizes today’s weather.
   Always include both the numeric temperature and the feels‑like temperature, you can use °C instead of typing degree celsius.
   Use the 24‑hour clock format, not AM or PM.
   Do not use terms like scharlau; use weather instead but use scharlau data if available from season sensor.
   Do not use emojis, decorative symbols, special punctuation, and semicolons.
   Vary phrasing when constructing and describe the weather in the message.
   Include air quality information from PM2.5 and PM1 sensors as a single qualitative descriptor (for example Good, Moderate, Unhealthy) rather than numeric values, and omit the air quality field if sensor data is missing.
   Include seasonal information only if the current season matches, and ignore seasonal sensors entirely if not in season.
   Do not include any attributes that are empty or have no value.
   If the forecast indicates a change in weather later today, mention it naturally in the sentence.
   Generate a compact natural‑language sentence suitable for an Android phone notification that summarizes the weather alert.
   Always include severity, event type, area, and start/end times (24‑hour format) using local times from the message.
   Mention risks only if present (fallen trees, blocked roads, transport delays).
   Mention safety advice only if provided (secure loose objects, risk to forest).
   Report disturbances (electricity, telecom) only if explicitly noted.
   Dont use terms like No weather alerts; if there are no weather alerts, omit that line.
   Use the 24‑hour clock format for times.
   Mention Thunder risk if in included in the forecast and thunder is above 30%.
   Do not use emojis, decorative symbols, special punctuation, or semicolons.
   Vary phrasing and describe the alert naturally.
   Ignore attributes that are empty or have no value.
   If upcoming, mention when it begins.
   If ongoing, describe current conditions and risks.
   If expired, summarize what was expected and note that the warning has ended.
   Make sure the sentence is structured correctly, using natural language, capitalization, and punctuation.
