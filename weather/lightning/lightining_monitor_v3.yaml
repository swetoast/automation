- platform: template
  sensors:
    lightning_strike_alert:
      friendly_name: "Lightning Strike Alert"
      device_class: safety
      value_template: >-
        {% set raw = states
           | selectattr('entity_id','match','^geo_location\.lightning_strike_')
           | list %}
        Raw entities: {{ raw|length }}

        {% set uniq = raw
           | unique(attribute='attributes.external_id')
           | list %}
        Unique strikes: {{ uniq|length }}

        {% set distances = uniq
           | map(attribute='state')
           | map('float')
           | list %}
        Distances: {{ distances }}

        {% set stamps = uniq
           | map(attribute='attributes.publication_date')
           | map('as_timestamp')
           | list %}
        Timestamps: {{ stamps }}

        {% set has_data = distances|length > 0 and stamps|length > 0 %}
        Has data: {{ has_data }}

        {% set now_ts = as_timestamp(now()) %}
        Now ts: {{ now_ts }}

        {% if distances|length > 0 %}
          {% set closest = distances|min %}
        {% else %}
          {% set closest = none %}
        {% endif %}
        Closest dist: {{ closest }}

        {% if stamps|length > 0 %}
          {% set latest_ts = stamps|max %}
        {% else %}
          {% set latest_ts = none %}
        {% endif %}
        Latest ts: {{ latest_ts }}

        {% if closest != none and latest_ts != none %}
          {% set age = (now_ts - latest_ts)|int %}
        {% else %}
          {% set age = none %}
        {% endif %}
        Age sec: {{ age }}

        {% set strikes = distances|length %}
        Strikes count: {{ strikes }}

        {% set raw_norm = strikes > 0 and ((strikes - 1) / 9) or 0 %}
        Raw norm: {{ raw_norm }}

        {% set clamp_list = [0, raw_norm, 1] | sort %}
        Clamped list: {{ clamp_list }}
        {% set i_clamped = clamp_list[1] %}
        Clamped intensity: {{ i_clamped }}

        {% set window = 300 + i_clamped * (1800 - 300) %}
        Window sec: {{ window }}

        {% set radius = 10 + i_clamped * (50 - 10) %}
        Radius km: {{ radius }}

        {% set epsilon = 0.99 %}
        {% if closest != none %}
          {% set ratio = closest / radius %}
          {% set d_norm = ratio > epsilon and epsilon or ratio %}
        {% else %}
          {% set d_norm = 1 %}
        {% endif %}
        Distance norm: {{ d_norm }}

        {% set exponent = 4 + i_clamped * (0.7 - 4) %}
        Fade exp: {{ exponent }}

        {% set fade = (1 - d_norm) ** exponent %}
        Fade: {{ fade }}

        {% set timeout = window * fade %}
        Timeout sec: {{ timeout }}

        Alert active: {{ has_data and age != none and age <= timeout }}

        {% if stamps|length > 1 %}
          {% set ss = stamps|sort %}
          {% set diffs = [] %}
          {% for i in range(1, ss|length) %}
            {% set diffs = diffs + [ ss[i] - ss[i-1] ] %}
          {% endfor %}
          {% set total = diffs|sum %}
          {% set n_diff = diffs|length %}
          {% if n_diff > 0 %}
            Avg interval sec: {{ (total / n_diff)|round(1) }}
          {% else %}
            Avg interval sec: 0
          {% endif %}
        {% else %}
          Avg interval sec: 0
        {% endif %}

        {% set pts = uniq | map(attribute='attributes') | list %}
        {% set n = pts|length %}
        Max cluster size:
        {% if n < 1 %}
          0
        {% else %}
          {% set th = 5.0 %}
          {% set counts = [] %}
          {% for i in range(n) %}
            {% set pi = pts[i] %}
            {% set cnt = 1 %}
            {% for j in range(n) %}
              {% if j != i %}
                {% set pj = pts[j] %}
                {% set dlat = (pj.latitude - pi.latitude) * 0.01745329252 %}
                {% set dlon = (pj.longitude - pi.longitude) * 0.01745329252 %}
                {% set a = (dlat/2)**2
                           + cos(pi.latitude*0.01745329252)
                           * cos(pj.latitude*0.01745329252)
                           * (dlon/2)**2 %}
                {% set c = 2 * asin(a**0.5) %}
                {% set dist = 6371.0 * c %}
                {% if dist <= th %}
                  {% set cnt = cnt + 1 %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set counts = counts + [cnt] %}
          {% endfor %}
          {{ counts|length > 0 and (counts|max) or 0 }}
        {% endif %}

        Is cluster:
        {% set th = 5.0 %}
        {% if n < 2 %}
          false
        {% else %}
          {% set found = false %}
          {% for i in range(n) %}
            {% for j in range(i+1, n) %}
              {% set pi = pts[i] %}
              {% set pj = pts[j] %}
              {% set dlat = (pj.latitude - pi.latitude) * 0.01745329252 %}
              {% set dlon = (pj.longitude - pi.longitude) * 0.01745329252 %}
              {% set a = (dlat/2)**2
                         + cos(pi.latitude*0.01745329252)
                         * cos(pj.latitude*0.01745329252)
                         * (dlon/2)**2 %}
              {% set c = 2 * asin(a**0.5) %}
              {% set dist = 6371.0 * c %}
              {% if dist <= th %}
                {% set found = true %}
                {% break %}
              {% endif %}
            {% endfor %}
            {% if found %}{% break %}{% endif %}
          {% endfor %}
          {{ found }}
        {% endif %}
