- platform: template
  sensors:
    lightning_strike_alert:
      friendly_name: "Lightning Strike Alert"
      device_class: safety
      value_template: >-
        {% set raw = states
           | selectattr('entity_id','match','^geo_location\.lightning_strike_')
           | list %}
        {% set uniq = raw
           | unique(attribute='attributes.external_id')
           | list %}
        {% set distances = uniq
           | map(attribute='state')
           | map('float')
           | list %}
        {% set stamps = uniq
           | map(attribute='attributes.publication_date')
           | map('as_timestamp')
           | list %}
        {% set has_data = distances|length > 0 and stamps|length > 0 %}
        {% set now_ts = as_timestamp(now()) %}
        {% if distances %}
          {% set closest = distances|min %}
        {% else %}
          {% set closest = none %}
        {% endif %}
        {% if stamps %}
          {% set latest_ts = stamps|max %}
        {% else %}
          {% set latest_ts = none %}
        {% endif %}
        {% if closest != none and latest_ts != none %}
          {% set age = (now_ts - latest_ts)|int %}
        {% else %}
          {% set age = none %}
        {% endif %}
        {% set strikes = distances|length %}
        {% if strikes > 0 %}
          {% set raw_norm = (strikes - 1) / 9 %}
        {% else %}
          {% set raw_norm = 0 %}
        {% endif %}
        {% if raw_norm < 0 %}
          {% set i_clamped = 0 %}
        {% elif raw_norm > 1 %}
          {% set i_clamped = 1 %}
        {% else %}
          {% set i_clamped = raw_norm %}
        {% endif %}
        {% set window = 300 + i_clamped * (1800 - 300) %}
        {% set radius = 10 + i_clamped * (50 - 10) %}
        {% set epsilon = 0.99 %}
        {% if closest %}
          {% set d_norm = closest / radius %}
          {% if d_norm > epsilon %}
            {% set d_norm = epsilon %}
          {% endif %}
        {% else %}
          {% set d_norm = 1 %}
        {% endif %}
        {% set exponent = 4 + i_clamped * (0.7 - 4) %}
        {% set fade = (1 - d_norm) ** exponent %}
        {% set timeout = window * fade %}
        {{ has_data and age != none and age <= timeout }}
      attribute_templates:
        raw_entities: >
          {% set raw = states
            | selectattr('entity_id','match','^geo_location\.lightning_strike_')
            | list %}
          {% set raw_entities = raw | length %}
          {{ raw_entities }}
        unique_strikes: >
          {% set raw = states
            | selectattr('entity_id','match','^geo_location\.lightning_strike_')
            | list %}
          {% set uniq = raw
            | unique(attribute='attributes.external_id')
            | list %}
          {{ uniq | length }}
        distances: >
          {% set raw = states
             | selectattr('entity_id','match','^geo_location\.lightning_strike_')
             | list %}
          {% set uniq = raw
             | unique(attribute='attributes.external_id')
             | list %}
          {% set distances = uniq
             | map(attribute='state')
             | map('float')
             | list %}
          {{ distances }}
        timestamps: >
          {% set raw = states
             | selectattr('entity_id','match','^geo_location\\.lightning_strike_')
             | list %}
          {% set uniq = raw
             | unique(attribute='attributes.external_id')
             | list %}
          {% set stamps = uniq
             | map(attribute='attributes.publication_date')
             | map('as_timestamp')
             | list %}
          {{ stamps }}
        has_data: >
          {% set raw = states
             | selectattr('entity_id','match','^geo_location\\.lightning_strike_')
             | list %}
          {% set uniq = raw
             | unique(attribute='attributes.external_id')
             | list %}
          {% set distances = uniq
             | map(attribute='state')
             | map('float')
             | list %}
          {% set stamps = uniq
             | map(attribute='attributes.publication_date')
             | map('as_timestamp')
             | list %}
          {% set has_data = distances|length > 0 and stamps|length > 0 %}
          {{ has_data }}
        now_ts: >
          {% set now_ts = as_timestamp(now()) %}
          {{ now_ts }}
        closest_dist: >
          {% set raw = states
             | selectattr('entity_id','match','^geo_location\\.lightning_strike_')
             | list %}
          {% set uniq = raw
             | unique(attribute='attributes.external_id')
             | list %}
          {% set distances = uniq
             | map(attribute='state')
             | map('float')
             | list %}
          {% if distances %}
            {% set closest = distances|min %}
          {% else %}
            {% set closest = none %}
          {% endif %}
          {{ closest }}
        latest_ts: >
          {% set raw = states
            | selectattr('entity_id','match','^geo_location\\.lightning_strike_')
            | list %}
          {% set uniq = raw
            | unique(attribute='attributes.external_id')
            | list %}
          {% set stamps = uniq
            | map(attribute='attributes.publication_date')
            | map('as_timestamp')
            | list %}
          {% if stamps %}{% set latest_ts = stamps|max %}{% else %}{% set latest_ts = none %}{% endif %}
          {{ latest_ts }}
        age_sec: >
          {% set raw = states|selectattr('entity_id','match','^geo_location\\.lightning_strike_')|list %}
          {% set uniq = raw|unique(attribute='attributes.external_id')|list %}
          {% set stamps = uniq|map(attribute='attributes.publication_date')|map('as_timestamp')|list %}
          {% set now_ts = as_timestamp(now()) %}
          {% if stamps %}{% set latest_ts = stamps|max %}{% else %}{% set latest_ts = none %}{% endif %}
          {% if latest_ts is not none %}{% set age = (now_ts - latest_ts)|int %}{% else %}{% set age = none %}{% endif %}
          {{ age }}

        strikes_count: >
          {% set raw = states|selectattr('entity_id','match','^geo_location\\.lightning_strike_')|list %}
          {% set uniq = raw|unique(attribute='attributes.external_id')|list %}
          {% set distances = uniq|map(attribute='state')|map('float')|list %}
          {{ distances|length }}

        raw_norm: >
          {% set raw = states|selectattr('entity_id','match','^geo_location\\.lightning_strike_')|list %}
          {% set uniq = raw|unique(attribute='attributes.external_id')|list %}
          {% set distances = uniq|map(attribute='state')|map('float')|list %}
          {% set strikes = distances|length %}
          {% if strikes > 0 %}{% set raw_norm = (strikes - 1) / 9 %}{% else %}{% set raw_norm = 0 %}{% endif %}
          {{ raw_norm }}

        i_clamped: >
          {% set raw = states|selectattr('entity_id','match','^geo_location\\.lightning_strike_')|list %}
          {% set uniq = raw|unique(attribute='attributes.external_id')|list %}
          {% set distances = uniq|map(attribute='state')|map('float')|list %}
          {% set strikes = distances|length %}
          {% if strikes > 0 %}{% set raw_norm = (strikes - 1) / 9 %}{% else %}{% set raw_norm = 0 %}{% endif %}
          {% if raw_norm < 0 %}
            {% set i_clamped = 0 %}
          {% elif raw_norm > 1 %}
            {% set i_clamped = 1 %}
          {% else %}
            {% set i_clamped = raw_norm %}
          {% endif %}
          {{ i_clamped }}

        window_sec: >
          {% set raw = states|selectattr('entity_id','match','^geo_location\\.lightning_strike_')|list %}
          {% set uniq = raw|unique(attribute='attributes.external_id')|list %}
          {% set distances = uniq|map(attribute='state')|map('float')|list %}
          {% set strikes = distances|length %}
          {% if strikes > 0 %}{% set raw_norm = (strikes - 1) / 9 %}{% else %}{% set raw_norm = 0 %}{% endif %}
          {% if raw_norm < 0 %}
           {% set i_clamped = 0 %}
          {% elif raw_norm > 1 %}
           {% set i_clamped = 1 %}
          {% else %}
            {% set i_clamped = raw_norm %}
          {% endif %}
          {% set window = 300 + i_clamped * (1800 - 300) %}
          {{ window }}

        radius_km: >
          {% set raw = states|selectattr('entity_id','match','^geo_location\\.lightning_strike_')|list %}
          {% set uniq = raw|unique(attribute='attributes.external_id')|list %}
          {% set distances = uniq|map(attribute='state')|map('float')|list %}
          {% set strikes = distances|length %}
          {% if strikes > 0 %}{% set raw_norm = (strikes - 1) / 9 %}{% else %}{% set raw_norm = 0 %}{% endif %}
          {% if raw_norm < 0 %}
           {% set i_clamped = 0 %}
          {% elif raw_norm > 1 %}
            {% set i_clamped = 1 %}
          {% else %}
            {% set i_clamped = raw_norm %}
          {% endif %}
          {% set radius = 10 + i_clamped * (50 - 10) %}
          {{ radius }}

        distance_norm: >
          {% set raw = states|selectattr('entity_id','match','^geo_location\\.lightning_strike_')|list %}
          {% set uniq = raw|unique(attribute='attributes.external_id')|list %}
          {% set distances = uniq|map(attribute='state')|map('float')|list %}
          {% if distances %}
            {% set closest = distances|min %}
          {% else %}
            {% set closest = none %}
          {% endif %}
          {% set strikes = distances|length %}
          {% if strikes > 0 %}{% set raw_norm = (strikes - 1) / 9 %}{% else %}{% set raw_norm = 0 %}{% endif %}
          {% if raw_norm < 0 %}
            {% set i_clamped = 0 %}
          {% elif raw_norm > 1 %}
            {% set i_clamped = 1 %}
          {% else %}
            {% set i_clamped = raw_norm %}
          {% endif %}
          {% set radius = 10 + i_clamped * (50 - 10) %}
          {% set epsilon = 0.99 %}
          {% if closest is not none %}
            {% set d_norm = closest / radius %}
            {% if d_norm > epsilon %}{% set d_norm = epsilon %}{% endif %}
          {% else %}
            {% set d_norm = 1 %}
          {% endif %}
          {{ d_norm }}

        fade_exp: >
          {% set raw = states|selectattr('entity_id','match','^geo_location\\.lightning_strike_')|list %}
          {% set uniq = raw|unique(attribute='attributes.external_id')|list %}
          {% set distances = uniq|map(attribute='state')|map('float')|list %}
          {% set strikes = distances|length %}
          {% if strikes > 0 %}{% set raw_norm = (strikes - 1) / 9 %}{% else %}{% set raw_norm = 0 %}{% endif %}
          {% set exponent = 4 + raw_norm * (0.7 - 4) %}
          {{ exponent }}

        fade: >
          {% set raw = states|selectattr('entity_id','match','^geo_location\\.lightning_strike_')|list %}
          {% set uniq = raw|unique(attribute='attributes.external_id')|list %}
          {% set distances = uniq|map(attribute='state')|map('float')|list %}
          {% if distances %}{% set closest = distances|min %}{% else %}{% set closest = none %}{% endif %}
          {% set strikes = distances|length %}
          {% if strikes > 0 %}{% set raw_norm = (strikes - 1) / 9 %}{% else %}{% set raw_norm = 0 %}{% endif %}
          {% if raw_norm < 0 %}
            {% set i_clamped = 0 %}
          {% elif raw_norm > 1 %}
            {% set i_clamped = 1 %}
          {% else %}
            {% set i_clamped = raw_norm %}
          {% endif %}
          {% set radius = 10 + i_clamped * (50 - 10) %}
          {% set epsilon = 0.99 %}
          {% if closest is not none %}
            {% set d_norm = closest / radius %}
            {% if d_norm > epsilon %}{% set d_norm = epsilon %}{% endif %}
          {% else %}
            {% set d_norm = 1 %}
          {% endif %}
          {% set exponent = 4 + i_clamped * (0.7 - 4) %}
          {% set fade = (1 - d_norm) ** exponent %}
          {{ fade }}

        timeout_sec: >
          {% set raw = states|selectattr('entity_id','match','^geo_location\\.lightning_strike_')|list %}
          {% set uniq = raw|unique(attribute='attributes.external_id')|list %}
          {% set distances = uniq|map(attribute='state')|map('float')|list %}
          {% set stamps = uniq|map(attribute='attributes.publication_date')|map('as_timestamp')|list %}
          {% set now_ts = as_timestamp(now()) %}
          {% if distances %}{% set closest = distances|min %}{% else %}{% set closest = none %}{% endif %}
          {% set strikes = distances|length %}
          {% if strikes > 0 %}{% set raw_norm = (strikes - 1) / 9 %}{% else %}{% set raw_norm = 0 %}{% endif %}
          {% if raw_norm < 0 %}
            {% set i_clamped = 0 %}
          {% elif raw_norm > 1 %}
            {% set i_clamped = 1 %}
          {% else %}
            {% set i_clamped = raw_norm %}
          {% endif %}
          {% set window = 300 + i_clamped * (1800 - 300) %}
          {% set radius = 10 + i_clamped * (50 - 10) %}
          {% set epsilon = 0.99 %}
          {% if closest is not none %}
            {% set d_norm = closest / radius %}
            {% if d_norm > epsilon %}{% set d_norm = epsilon %}{% endif %}
          {% else %}
            {% set d_norm = 1 %}
          {% endif %}
          {% set exponent = 4 + i_clamped * (0.7 - 4) %}
          {% set fade = (1 - d_norm) ** exponent %}
          {% set timeout = window * fade %}
          {{ timeout }}

        avg_interval_sec: >-
          {% set stamps = states
             | selectattr('entity_id','match','^geo_location\.lightning_strike_')
             | unique(attribute='attributes.external_id')
             | map(attribute='attributes.publication_date')
             | map('as_timestamp')
             | map('int')
             | unique
             | sort
             | list %}

          {% if stamps | length > 1 %}
            {% set n     = stamps | length %}
            {% set first = stamps[0] %}
            {% set last  = stamps[n - 1] %}
            {{ ((last - first) / (n - 1)) | round(0) }}
          {% else %}
            0
          {% endif %}
