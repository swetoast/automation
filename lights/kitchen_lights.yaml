alias: "Lights: Kitchen Lights"
description: ""
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.kitchen_presence_sensor
    from: null
    to: null
conditions:
  - condition: numeric_state
    entity_id: sensor.kitchen_lux_sensor
    below: 5
    alias: Brightness
actions:
  - alias: There
    if:
      - condition: state
        entity_id: binary_sensor.kitchen_presence_sensor
        state: "on"
      - alias: False Flags
        condition: not
        conditions:
          - condition: state
            entity_id: vacuum.roborock_s8_pro_ultra
            state: cleaning
      - condition: state
        entity_id:
          - light.kitchen_ceiling_lights
          - light.kitchen_window_lights_local
        state: "off"
    then:
      - action: light.turn_on
        target:
          entity_id:
            - light.kitchen_ceiling_lights
            - light.kitchen_window_lights_local
        data: {}
      - wait_for_trigger:
          - trigger: state
            entity_id:
              - binary_sensor.kitchen_presence_sensor
            to: "off"
            for:
              seconds: 30
      - condition: state
        entity_id:
          - light.kitchen_ceiling_lights
          - light.kitchen_window_lights_local
        state: "on"
      - action: light.turn_off
        target:
          entity_id:
            - light.kitchen_ceiling_lights
            - light.kitchen_window_lights_local
        data: {}
  - alias: Not There
    if:
      - condition: state
        entity_id: binary_sensor.kitchen_presence_sensor
        state: "off"
      - condition: state
        entity_id:
          - light.kitchen_ceiling_lights
          - light.kitchen_window_lights_local
        state: "on"
    then:
      - action: light.turn_off
        target:
          entity_id:
            - light.kitchen_ceiling_lights
            - light.kitchen_window_lights_local
        data: {}
mode: restart
