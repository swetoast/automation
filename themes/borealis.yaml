borealis:
# Version 1
# Used for desktops
  font-family: >-
    "Inter", "Roboto Flex", "Noto Sans", "Barlow", "Quicksand", "Raleway", "Segoe UI"
  primary-font-family: var(--font-family)
  ha-font-family-heading: var(--font-family)
  ha-font-family-body: var(--font-family)
  ha-font-family-code: var(--font-family)
  ha-font-family-longform: var(--font-family)
  ha-card-header-font-family: var(--font-family)

  md-sys-shape-corner-full: 9999px
  md-sys-shape-corner-extra-large: 16px
  md-sys-shape-corner-large: 12px
  md-sys-shape-corner-medium: 8px
  md-sys-shape-corner-small: 4px

  md-sys-elevation-level0: none
  md-sys-elevation-level1: rgba(0,0,0,0.18) 0 1px 2px 0
  md-sys-elevation-level2: rgba(0,0,0,0.20) 0 2px 6px 0
  md-sys-elevation-level3: rgba(0,0,0,0.24) 0 4px 10px 0
  md-sys-elevation-level4: rgba(0,0,0,0.28) 0 6px 16px 0

  modes:
    dark:
      md-sys-color-primary: '#22d3ee'
      md-sys-color-on-primary: '#081018'
      md-sys-color-primary-container: '#0b2430'
      md-sys-color-on-primary-container: '#b8f2fb'
      md-sys-color-secondary: '#a5b4c5'
      md-sys-color-on-secondary: '#0b1220'
      md-sys-color-secondary-container: '#141b2a'
      md-sys-color-on-secondary-container: '#c9d3e1'
      md-sys-color-tertiary: '#8b5cf6'
      md-sys-color-on-tertiary: '#0f0b1a'
      md-sys-color-tertiary-container: '#1a1230'
      md-sys-color-on-tertiary-container: '#d9ccff'
      md-sys-color-surface: '#0b1020'
      md-sys-color-surface-variant: '#12182a'
      md-sys-color-on-surface: '#e6eefb'
      md-sys-color-on-surface-variant: '#9aa6ba'
      md-sys-color-surface-container-lowest: '#070a15'
      md-sys-color-surface-container-low: '#0f1526'
      md-sys-color-surface-container: '#121a2e'
      md-sys-color-surface-container-high: '#162036'
      md-sys-color-surface-container-highest: '#1b2740'
      md-sys-color-outline: '#2a3955'
      md-sys-color-outline-variant: '#1f2b44'
      md-sys-color-error: '#ff8680'
      md-sys-color-on-error: '#2b0a0a'
      md-sys-color-error-container: '#5a1b1b'
      md-sys-color-on-error-container: '#ffd9d4'
      md-sys-color-shadow: '#000000'
      md-sys-color-inverse-surface: '#ecf2fb'
      md-sys-color-inverse-on-surface: '#0c1220'
      md-sys-color-inverse-primary: '#0b79b5'
      md-sys-color-surface-tint: '#22d3ee'

      rgb-primary-color: '34,211,238'
      rgb-secondary-color: '165,180,197'
      rgb-tertiary-color: '139,92,246'
      rgb-on-surface-color: '230,238,251'
      rgb-outline-color: '42,57,85'

      disabled-text-color: 'rgba(230,238,251,0.38)'
      disabled-color: 'rgba(255,255,255,0.08)'
      state-inactive-color: '#3a4863'
      state-hover-opacity: 0.08
      state-pressed-opacity: 0.12
      state-selected-opacity: 0.16

    light:
      md-sys-color-primary: '#0ea5e9'
      md-sys-color-on-primary: '#ffffff'
      md-sys-color-primary-container: '#d5f1ff'
      md-sys-color-on-primary-container: '#063a55'
      md-sys-color-secondary: '#495a72'
      md-sys-color-on-secondary: '#ffffff'
      md-sys-color-secondary-container: '#eaf0fa'
      md-sys-color-on-secondary-container: '#263143'
      md-sys-color-tertiary: '#6d28d9'
      md-sys-color-on-tertiary: '#ffffff'
      md-sys-color-tertiary-container: '#efe6ff'
      md-sys-color-on-tertiary-container: '#2e1065'

      md-sys-color-surface: '#fbfdff'
      md-sys-color-surface-variant: '#eef3fb'
      md-sys-color-on-surface: '#0c1220'
      md-sys-color-on-surface-variant: '#3b4a60'
      md-sys-color-surface-container-lowest: '#ffffff'
      md-sys-color-surface-container-low: '#f3f7fe'
      md-sys-color-surface-container: '#edf3fc'
      md-sys-color-surface-container-high: '#e8effa'
      md-sys-color-surface-container-highest: '#e1ebf8'

      md-sys-color-outline: '#bfcddb'
      md-sys-color-outline-variant: '#b4c1d3'
      md-sys-color-error: '#d32f2f'
      md-sys-color-on-error: '#ffffff'
      md-sys-color-error-container: '#fde7e7'
      md-sys-color-on-error-container: '#410e0e'
      md-sys-color-shadow: '#000000'
      md-sys-color-inverse-surface: '#243042'
      md-sys-color-inverse-on-surface: '#eaf1fb'
      md-sys-color-inverse-primary: '#2aa8e8'
      md-sys-color-surface-tint: '#0ea5e9'

      rgb-primary-color: '14,165,233'
      rgb-secondary-color: '73,90,114'
      rgb-tertiary-color: '109,40,217'
      rgb-on-surface-color: '12,18,32'
      rgb-outline-color: '191,205,219'

      disabled-text-color: 'rgba(12,18,32,0.38)'
      disabled-color: 'rgba(0,0,0,0.08)'
      state-inactive-color: '#8a9ab1'
      state-hover-opacity: 0.07
      state-pressed-opacity: 0.12
      state-selected-opacity: 0.14

  primary-color: var(--md-sys-color-primary)
  accent-color: var(--md-sys-color-tertiary)
  primary-background-color: var(--md-sys-color-surface)
  background-color: var(--md-sys-color-surface)
  card-background-color: var(--md-sys-color-surface-container)
  ha-card-background: var(--md-sys-color-surface-container)
  ha-card-border-radius: var(--md-sys-shape-corner-large)
  ha-config-card-border-radius: var(--md-sys-shape-corner-large)
  ha-card-box-shadow: var(--md-sys-elevation-level2)
  ha-card-border: none
  ha-card-border-width: 0
  ha-card-border-style: none
  ha-card-border-color: '#00000000'

  app-header-background-color: var(--md-sys-color-surface)
  app-header-text-color: var(--md-sys-color-on-surface)
  app-header-edit-text-color: var(--md-sys-color-on-surface-variant)
  header-height: 56px

  text-primary-color: var(--md-sys-color-on-surface)
  primary-text-color: var(--md-sys-color-on-surface)
  secondary-text-color: var(--md-sys-color-on-surface-variant)
  text-light-primary-color: var(--md-sys-color-on-surface)
  label-badge-text-color: var(--md-sys-color-on-surface-variant)
  divider-color: var(--md-sys-color-outline-variant)

  sidebar-background-color: var(--md-sys-color-surface-container)
  sidebar-icon-color: var(--md-sys-color-on-surface-variant)
  sidebar-selected-background: var(--md-sys-color-secondary-container)
  sidebar-selected-icon-color: var(--md-sys-color-secondary)
  sidebar-selected-text-color: var(--md-sys-color-on-secondary-container)
  sidebar-text-color: var(--md-sys-color-on-surface-variant)
  paper-listbox-background-color: var(--sidebar-background-color)

  input-background-color: var(--md-sys-color-surface-container-highest)
  input-fill-color: var(--md-sys-color-surface-container-highest)
  input-ink-color: var(--md-sys-color-on-surface)
  input-label-ink-color: var(--md-sys-color-on-surface-variant)
  input-idle-line-color: var(--md-sys-color-outline)
  input-hover-line-color: var(--md-sys-color-primary)
  input-dropdown-icon-color: var(--md-sys-color-on-surface-variant)

  mdc-theme-background: var(--md-sys-color-surface)
  mdc-theme-primary: var(--md-sys-color-primary)
  mdc-theme-secondary: var(--md-sys-color-secondary)
  mdc-theme-on-primary: var(--md-sys-color-on-primary)
  mdc-theme-on-secondary: var(--md-sys-color-on-secondary)
  mdc-theme-on-surface: var(--md-sys-color-on-surface)
  mdc-theme-error: var(--md-sys-color-error)

  mdc-text-field-fill-color: var(--input-fill-color)
  mdc-text-field-ink-color: var(--input-ink-color)
  mdc-text-field-label-ink-color: var(--input-label-ink-color)
  mdc-text-field-idle-line-color: var(--input-idle-line-color)
  mdc-text-field-hover-line-color: var(--input-hover-line-color)
  mdc-select-fill-color: var(--input-fill-color)
  mdc-select-ink-color: var(--input-ink-color)
  mdc-select-label-ink-color: var(--input-label-ink-color)
  mdc-select-idle-line-color: var(--input-idle-line-color)
  mdc-select-hover-line-color: var(--input-hover-line-color)
  mdc-select-dropdown-icon-color: var(--input-dropdown-icon-color)

  paper-slider-knob-color: var(--md-sys-color-primary)
  paper-slider-knob-start-color: var(--md-sys-color-primary)
  paper-slider-pin-color: var(--md-sys-color-surface-container-high)
  paper-slider-active-color: var(--md-sys-color-primary)
  paper-slider-secondary-color: var(--md-sys-color-surface-container-low)
  paper-slider-container-color: var(--md-sys-color-surface-variant)
  ha-slider-track-size: 24px

  paper-toggle-button-checked-ink-color: var(--md-sys-color-primary)
  paper-toggle-button-checked-bar-color: var(--md-sys-color-primary)
  paper-toggle-button-unchecked-button-color: var(--md-sys-color-outline)
  paper-toggle-button-unchecked-bar-color: var(--md-sys-color-outline-variant)
  paper-toggle-button-unchecked-ink-color: var(--md-sys-color-outline-variant)

  switch-checked-button-color: var(--md-sys-color-on-primary)
  switch-checked-track-color: var(--md-sys-color-primary)
  switch-unchecked-button-color: var(--md-sys-color-outline)
  switch-unchecked-track-color: var(--md-sys-color-surface-container-highest)

  paper-radio-button-checked-color: var(--md-sys-color-primary)

  table-row-background-color: var(--md-sys-color-surface)
  table-row-alternative-background-color: var(--md-sys-color-surface-container)
  ha-data-table-header-background: var(--md-sys-color-surface-container-high)
  ha-data-table-row-background: var(--table-row-background-color)
  ha-data-table-row-striped-background: var(--table-row-alternative-background-color)
  ha-data-table-row-hover-background: rgb(var(--rgb-on-surface-color) / 0.06)
  ha-data-table-divider-color: var(--md-sys-color-outline-variant)

  paper-dialog-background-color: var(--md-sys-color-surface-container-high)
  ha-dialog-surface-background: var(--md-sys-color-surface-container-high)
  ha-dialog-border-radius: var(--md-sys-shape-corner-extra-large)

  state-icon-color: var(--md-sys-color-on-surface-variant)
  state-active-color: var(--md-sys-color-primary)
  state-red-color: '#ff6b6b'
  state-green-color: '#22c55e'
  state-orange-color: '#fbbf24'
  state-binary_sensor-active-color: var(--md-sys-color-primary)
  state-light-active-color: var(--md-sys-color-primary)
  state-switch-active-color: var(--md-sys-color-primary)
  state-automation-active-color: var(--md-sys-color-tertiary)
  state-lock-locked-color: var(--md-sys-color-primary)
  state-lock-unlocked-color: var(--state-icon-color)
  state-climate-heat-color: var(--state-orange-color)

  label-badge-background-color: var(--md-sys-color-surface-container-low)
  label-badge-red: '#27324a'
  label-badge-blue: '#163a4a'
  label-badge-green: '#133a2b'
  label-badge-yellow: '#3d3521'

  lumo-primary-color: var(--md-sys-color-primary)
  lumo-body-text-color: var(--md-sys-color-on-surface)
  lumo-base-color: var(--md-sys-color-surface)

  energy-grid-consumption-color: '#3ba3ff'
  energy-grid-return-color: '#8b5cf6'
  energy-solar-color: '#ffb020'
  energy-non-fossil-color: '#16a34a'
  energy-battery-out-color: '#34d399'
  energy-battery-in-color: '#f472b6'
  energy-gas-color: '#ef4444'
  energy-water-color: '#22d3ee'

  ha-tooltip-border-radius: var(--md-sys-shape-corner-full)
  ha-tooltip-font-family: var(--font-family)

  space-2xs: 4px
  space-xs: 8px
  space-s: 12px
  space-m: 16px
  space-l: 24px
  space-xl: 32px
  card-padding: var(--space-m)
  stack-gap-x: var(--space-s)
  stack-gap-y: var(--space-m)
  ha-view-sections-narrow-column-gap: var(--space-m)

  ha-font-size-s: 0.875rem
  ha-font-size-m: 1rem
  ha-font-size-l: 1.125rem
  ha-font-size-xl: 1.25rem
  ha-font-size-2xl: 1.5rem
  ha-line-height-normal: 1.5
  ha-line-height-condensed: 1.3
  ha-font-weight-regular: 400
  ha-font-weight-medium: 500
  ha-font-weight-semibold: 600

  motion-duration-fast: 150ms
  motion-duration-default: 200ms
  motion-duration-slow: 300ms
  motion-ease-standard: cubic-bezier(0.4,0,0.2,1)
  reduced-motion: 0

  state-hover-opacity: 0.08
  state-pressed-opacity: 0.12
  state-selected-opacity: 0.16
  focus-ring-color: rgb(var(--rgb-primary-color) / 0.45)
  focus-ring-outline: 3px auto var(--focus-ring-color)

  mdc-snackbar-fill-color: var(--md-sys-color-inverse-surface)
  mdc-snackbar-ink-color: var(--md-sys-color-inverse-on-surface)

  ha-skeleton-color: rgb(var(--rgb-on-surface-color) / 0.06)
  ha-skeleton-active-color: rgb(var(--rgb-on-surface-color) / 0.12)

  borealis-extras-enabled: 1
  --borealis-accent-stripe: 1
  --borealis-morph-corners: 1
  --borealis-state-layer: 1
  --borealis-active-halo: 1
  --borealis-rail-highlight: 1
  --borealis-snackbar-progress: 1
  --borealis-flow-stripes: 1

  card-mod-theme: borealis
  card-mod-root-yaml: |
    html, body, ha-app-layout, ha-main, ha-sidebar, ha-card, mwc-button, mwc-tab, ha-chip, *:not(ha-icon):not(mwc-icon):not(.material-icons):not([class*="material-symbols"]) { font-family: var(--font-family) !important; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    :host { --md-r-1: var(--md-sys-shape-corner-medium); --md-r-2: var(--md-sys-shape-corner-large); --md-e-1: var(--md-sys-elevation-level1); --md-e-2: var(--md-sys-elevation-level2); --md-e-3: var(--md-sys-elevation-level3); font-variant-numeric: tabular-nums; --mdc-typography-font-family: var(--font-family); --mdc-typography-body1-font-family: var(--font-family); --mdc-typography-button-font-family: var(--font-family); --mushroom-font-family: var(--font-family); --borealis-contrast-boost: 1.12; --mdc-ripple-color: color-mix(in srgb, var(--md-sys-color-primary) 70%, transparent); --mdc-ripple-press-opacity: 0.18; --mdc-ripple-hover-opacity: 0.10; --chip-font-family: "Quicksand", "Inter", "Noto Sans", "Barlow", "Raleway", "Roboto Flex"; }
    * { scrollbar-color: var(--md-sys-color-secondary) var(--md-sys-color-surface-container); }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--md-sys-color-secondary) 65%, transparent); border-radius: 9999px; }
    *::-webkit-scrollbar-track { background: var(--md-sys-color-surface-container); }
    mushroom-chips-card, mushroom-chips, mushroom-chip, mushroom-template-chip, mushroom-person-chip, mushroom-entity-chip { font-family: var(--font-family) !important; }
    ha-card, ha-textfield, ha-select, mwc-tab, ha-chip { filter: contrast(var(--borealis-contrast-boost)); }
    ha-sidebar .menu a[aria-current="page"] mwc-list-item { background: linear-gradient(90deg, color-mix(in srgb, var(--md-sys-color-secondary-container) 85%, transparent) 0%, color-mix(in srgb, var(--md-sys-color-primary) 18%, transparent) 100%); border-radius: var(--md-sys-shape-corner-medium); box-shadow: var(--md-sys-elevation-level1); outline: 2px solid rgb(var(--rgb-primary-color) / 0.12); outline-offset: -2px; filter: contrast(calc(1 + (0.06 * var(--borealis-rail-highlight)))); }
    @media (prefers-reduced-motion: no-preference) { .skeleton, .ha-skeleton { background: linear-gradient(90deg, rgb(var(--rgb-on-surface-color) / 0.06) 25%, rgb(var(--rgb-on-surface-color) / 0.12) 37%, rgb(var(--rgb-on-surface-color) / 0.06) 63%); background-size: 400% 100%; animation: borealis-shimmer var(--motion-duration-slow) linear infinite; } @keyframes borealis-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } } }
    .mdc-snackbar { filter: drop-shadow(0 6px 16px rgb(0 0 0 / 0.24)); }
    .mdc-snackbar .mdc-snackbar__surface { position: relative; border-radius: var(--md-sys-shape-corner-large); overflow: hidden; }
    .mdc-snackbar .mdc-snackbar__surface::before { content: ""; position: absolute; inset: 0 auto auto 0; width: 4px; height: 100%; background: linear-gradient(var(--md-sys-color-primary), var(--md-sys-color-tertiary)); opacity: .9; }
    .mdc-snackbar .mdc-snackbar__surface::after { content: ""; position: absolute; left: 4px; right: 0; bottom: 0; height: 3px; background: color-mix(in srgb, var(--md-sys-color-primary) 65%, transparent); transform-origin: left; animation: borealis-snack var(--motion-duration-slow) ease-out forwards; opacity: calc(0.85 * var(--borealis-snackbar-progress)); }
    @keyframes borealis-snack { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  card-mod-card-yaml: |
    ha-card { padding: var(--card-padding); border-radius: var(--md-r-2); box-shadow: var(--md-e-2); transition: box-shadow var(--motion-duration-default) var(--motion-ease-standard), transform var(--motion-duration-fast) var(--motion-ease-standard), outline-color var(--motion-duration-fast) var(--motion-ease-standard); position: relative; overflow: clip; }
    ha-card:hover { box-shadow: var(--md-e-3); transform: translateY(calc(-1px * (1 - var(--reduced-motion)))); }
    ha-card:active { box-shadow: var(--md-e-4); transform: translateY(calc(-2px * (1 - var(--reduced-motion)))); }
    ha-card:focus-within { outline: 3px auto var(--focus-ring-color); outline-offset: 2px; }
    ha-card .card-header { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; row-gap: 2px; align-items: center; letter-spacing: .2px; }
    ha-card .card-header h1 { font-size: var(--ha-font-size-m); font-weight: var(--ha-font-weight-semibold); margin: 0; }
    ha-card .card-header .name { font-size: var(--ha-font-size-s); color: var(--md-sys-color-on-surface-variant); display: inline-block; padding: 2px 8px; border-radius: 9999px; background: var(--md-sys-color-surface-variant); }
    @supports selector(ha-card:has(*)) { ha-card:has([state-active]), ha-card:has([aria-checked="true"]) { outline: 2px solid transparent; outline-offset: 2px; position: relative; } ha-card:has([state-active])::after, ha-card:has([aria-checked="true"])::after { content: ""; position: absolute; inset: -2px; border-radius: inherit; background: conic-gradient(from 0deg, color-mix(in srgb, var(--md-sys-color-primary) 60%, transparent), color-mix(in srgb, var(--md-sys-color-tertiary) 50%, transparent), color-mix(in srgb, var(--md-sys-color-primary) 60%, transparent)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 2px; opacity: calc(0.8 * var(--borealis-active-halo)); pointer-events: none; animation: borealis-halo 6s linear infinite; } @keyframes borealis-halo { to { transform: rotate(1turn); } } }
    ha-card::before { content: ""; position: absolute; inset: 0 auto auto 0; height: calc(3px * var(--borealis-accent-stripe)); width: 28%; border-top-left-radius: inherit; border-top-right-radius: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--md-sys-color-primary) 85%, transparent) 0%, color-mix(in srgb, var(--md-sys-color-tertiary) 65%, transparent) 100%); transition: width var(--motion-duration-default) var(--motion-ease-standard); pointer-events: none; }
    ha-card:hover::before { width: 52%; }
    ha-card:active::before { width: 72%; }
    ha-card { background-image: linear-gradient(0deg, transparent 0 100%); background-blend-mode: overlay; transition: background-image var(--motion-duration-fast) var(--motion-ease-standard); }
    ha-card:hover { background-image: linear-gradient(0deg, color-mix(in srgb, var(--md-sys-color-primary) 6%, transparent) 0 100%); }
    ha-card:active { background-image: linear-gradient(0deg, color-mix(in srgb, var(--md-sys-color-primary) 10%, transparent) 0 100%); }
    ha-card { border-radius: clamp(var(--md-r-2), calc(var(--md-r-2) + (var(--borealis-morph-corners) * 4px)), calc(var(--md-r-2) + (var(--borealis-morph-corners) * 4px))); transition: border-radius var(--motion-duration-default) var(--motion-ease-standard); }
    ha-card:hover { border-radius: clamp(var(--md-r-2), calc(var(--md-r-2) + (var(--borealis-morph-corners) * 8px)), calc(var(--md-r-2) + (var(--borealis-morph-corners) * 8px))); }
    ha-card [role="progressbar"], ha-card ha-circular-progress, ha-card ha-linear-progress { --progress-background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--md-sys-color-primary) 22%, transparent) 0 10px, color-mix(in srgb, var(--md-sys-color-primary) 0%, transparent) 10px 20px); background-image: var(--progress-background); background-size: 200% 100%; animation: borealis-flow 3s linear infinite; opacity: calc(0.9 * var(--borealis-flow-stripes)); }
    @keyframes borealis-flow { to { background-position: -200% 0; } }
    :host([panel-mode="wall"]) ha-card { background: color-mix(in srgb, var(--md-sys-color-surface) 88%, transparent); backdrop-filter: saturate(110%) blur(6px); }
    hui-history-graph-card, hui-statistics-graph-card { --primary-text-color: var(--md-sys-color-on-surface); --secondary-text-color: var(--md-sys-color-on-surface-variant); --accent-color: var(--md-sys-color-primary); --ha-card-border-color: var(--md-sys-color-outline-variant); }

  card-mod-more-info-yaml: |
    $: |
      .mdc-dialog .mdc-dialog__scrim { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(0,0,0,.45); }
