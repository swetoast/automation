  card-mod-theme: borealis-compact
  card-mod-root-yaml: |
    :host {
      --md-r-1: var(--md-sys-shape-corner-medium);
      --md-r-2: var(--ha-card-border-radius);
      --md-e-1: var(--md-sys-elevation-level1);
      --md-e-2: var(--md-sys-elevation-level2);
      --md-e-3: var(--md-sys-elevation-level3);
      font-variant-numeric: tabular-nums;

      /* Typography overrides */
      --mdc-typography-font-family: var(--font-family);
      --mdc-typography-body1-font-family: var(--font-family);
      --mdc-typography-button-font-family: var(--font-family);
      --mushroom-font-family: var(--font-family);

      --borealis-contrast-boost: 1.12;
    }

    /* Compact scrollbars */
    * { scrollbar-color: var(--md-sys-color-secondary) var(--md-sys-color-surface-container); }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--md-sys-color-secondary) 65%, transparent);
      border-radius: 9999px;
    }
    *::-webkit-scrollbar-track { background: var(--md-sys-color-surface-container); }

    /* Mushroom font enforcement */
    mushroom-chips-card,
    mushroom-chips,
    mushroom-chip,
    mushroom-template-chip,
    mushroom-person-chip,
    mushroom-entity-chip { font-family: var(--font-family) !important; }

    /* Contrast boost */
    ha-card, ha-textfield, ha-select, mwc-tab, ha-chip {
      filter: contrast(var(--borealis-contrast-boost));
    }

    /* Skeleton shimmer */
    @media (prefers-reduced-motion: no-preference) {
      .skeleton, .ha-skeleton {
        background: linear-gradient(
          90deg,
          rgb(var(--rgb-on-surface-color) / 0.06) 25%,
          rgb(var(--rgb-on-surface-color) / 0.12) 37%,
          rgb(var(--rgb-on-surface-color) / 0.06) 63%
        );
        background-size: 400% 100%;
        animation: borealis-shimmer var(--motion-duration-slow) linear infinite;
      }
      @keyframes borealis-shimmer {
        0% { background-position: 100% 0; }
        100% { background-position: 0 0; }
      }
    }

  card-mod-card-yaml: |
    ha-card {
      padding: var(--card-padding);
      border-radius: var(--ha-card-border-radius);
      box-shadow: var(--md-sys-elevation-level2);
      transition:
        box-shadow var(--motion-duration-default) var(--motion-ease-standard),
        transform var(--motion-duration-fast) var(--motion-ease-standard),
        outline-color var(--motion-duration-fast) var(--motion-ease-standard);
    }
    ha-card:hover {
      box-shadow: var(--md-sys-elevation-level3);
      transform: translateY(calc(-1px * (1 - var(--reduced-motion))));
    }
    ha-card:active {
      box-shadow: var(--md-sys-elevation-level4);
      transform: translateY(calc(-2px * (1 - var(--reduced-motion))));
    }
    ha-card:focus-within {
      outline: 3px auto var(--focus-ring-color);
      outline-offset: 2px;
    }

    /* Condensed header layout */
    ha-card .card-header {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      row-gap: 2px;
      align-items: center;
      letter-spacing: .2px;
    }
    ha-card .card-header h1 {
      font-size: var(--ha-font-size-l);
      font-weight: var(--ha-font-weight-semibold);
      margin: 0;
    }
    ha-card .card-header .name {
      font-size: var(--ha-font-size-m);
      color: var(--md-sys-color-on-surface-variant);
    }

    /* Active state elevation/outline */
    ha-card:has([state-active]),
    ha-card:has([aria-checked="true"]) {
      box-shadow: var(--md-sys-elevation-level3);
      outline: 2px solid rgb(var(--rgb-primary-color) / 0.25);
      outline-offset: 2px;
    }

    /* Charts alignment */
    hui-history-graph-card, hui-statistics-graph-card {
      --primary-text-color: var(--md-sys-color-on-surface);
      --secondary-text-color: var(--md-sys-color-on-surface-variant);
      --accent-color: var(--md-sys-color-primary);
      --ha-card-border-color: var(--md-sys-color-outline-variant);
    }

  card-mod-more-info-yaml: |
    $: |
      .mdc-dialog .mdc-dialog__scrim {
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        background: rgba(0,0,0,.45);
      }
      .mdc-dialog .mdc-dialog__container .mdc-dialog__surface {
        border-radius: var(--md-sys-shape-corner-extra-large) !important;
        box-shadow: var(--md-sys-elevation-level3) !important;
        background: var(--ha-dialog-surface-background) !important;
        overflow: hidden;
      }
      .mdc-dialog .mdc-dialog__title {
        padding-bottom: 12px;
        border-bottom: 1px solid var(--md-sys-color-outline-variant);
      }
      .mdc-dialog .mdc-dialog__actions {
        position: sticky; bottom: 0;
        background: var(--ha-dialog-surface-background);
        border-top: 1px solid var(--md-sys-color-outline-variant);
      }

  card-mod-row-yaml: |
    *:focus-visible { outline: var(--focus-ring-outline); outline-offset: 2px; }

    mwc-list-item { min-height: 36px; padding: 0 8px; }
    mwc-list-item .mdc-list-item__meta { color: var(--md-sys-color-on-surface-variant); }
    mwc-list-item:hover { background: rgb(var(--rgb-on-surface-color) / var(--state-hover-opacity)); }
    mwc-list-item:active { background: rgb(var(--rgb-on-surface-color) / var(--state-pressed-opacity)); }

    ha-textfield, ha-select {
      --mdc-shape-medium: var(--md-sys-shape-corner-medium);
      border-radius: var(--md-sys-shape-corner-medium) !important;
      transition: box-shadow var(--motion-duration-fast) var(--motion-ease-standard);
    }
    ha-textfield:hover .mdc-notched-outline__leading,
    ha-textfield:hover .mdc-notched-outline__trailing,
    ha-select:hover .mdc-notched-outline__leading,
    ha-select:hover .mdc-notched-outline__trailing {
      border-color: var(--md-sys-color-primary) !important;
    }
    ha-textfield:focus-within,
    ha-select:focus-within {
      box-shadow: 0 0 0 3px rgb(var(--rgb-primary-color) / 0.18);
    }

    ha-state-icon {
      --mdc-icon-size: 22px;
      color: var(--state-icon-color);
      transition: color var(--motion-duration-fast) var(--motion-ease-standard);
    }
    ha-state-icon[state-active],
    ha-state-icon[aria-checked="true"] { color: var(--state-active-color); }

    hui-generic-entity-row { position: relative; }
    hui-generic-entity-row::after {
      content: attr(data-badge);
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-size: var(--ha-font-size-s);
      color: var(--md-sys-color-on-surface-variant);
      background: var(--md-sys-color-surface-variant);
      padding: 2px 6px; border-radius: 9999px;
    }

  card-mod-header-yaml: |
    mwc-button, ha-icon-button {
      border-radius: var(--md-sys-shape-corner-small) !important;
      box-shadow: var(--md-sys-elevation-level1);
      transition: box-shadow var(--motion-duration-fast) var(--motion-ease-standard),
                  transform var(--motion-duration-fast) var(--motion-ease-standard);
    }
    mwc-button:hover, ha-icon-button:hover {
      box-shadow: var(--md-sys-elevation-level2);
      transform: translateY(calc(-1px * (1 - var(--reduced-motion))));
    }
    ha-icon-button {
      transition: transform var(--motion-duration-fast) var(--motion-ease-standard);
    }
       ha-icon-button:hover {
      transform: translateY(calc(-1px * (1 - var(--reduced-motion))));
    }

  card-mod-tab-yaml: |
    mwc-tab {
      border-radius: var(--md-sys-shape-corner-small);
      --mdc-theme-primary: var(--md-sys-color-primary);
      position: relative;
    }
    mwc-tab[active] {
      background: rgb(var(--rgb-primary-color) / var(--state-selected-opacity));
    }
    mwc-tab::after {
      content: "";
      position: absolute; bottom: 4px; left: 12px; right: 12px;
      height: 2px; border-radius: 2px; background: var(--md-sys-color-primary);
      opacity: .0;
      transition: opacity var(--motion-duration-fast) var(--motion-ease-standard);
    }
    mwc-tab[active]::after { opacity: 1; }

  card-mod-chip-yaml: |
    ha-chip, .mdc-chip {
      border-radius: 16px !important;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      box-shadow: var(--md-sys-elevation-level1);
      font-family: var(--font-family) !important;
    }

    mushroom-chips-card,
    mushroom-chips,
    mushroom-chip,
    mushroom-template-chip,
    mushroom-person-chip,
    mushroom-entity-chip {
      font-family: var(--font-family) !important;
    }
    mushroom-chips { gap: 6px; }
    mushroom-chip { padding: 0 10px; min-height: 28px; }
    mushroom-chip:hover  { background: rgb(var(--rgb-primary-color) / var(--state-hover-opacity)); }
