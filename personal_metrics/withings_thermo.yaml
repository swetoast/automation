  - platform: template
    sensors:
      withings_thermo_temperature:
        friendly_name: "Withings Thermo Temperature"
        device_class: temperature
        unit_of_measurement: "°C"
        value_template: >-
          {% set raw = states('sensor.withings_body_temperature') %}
          {% set amb = states('sensor.withings_temperature') %}
          {% set invalid = ['unknown','unavailable','None'] %}
          {% if raw in invalid or amb in invalid %}
            unavailable
          {% else %}
            {% set ε = 0.98 %}
            {% set a = 15.87 %}
            {% set b = 0.655 %}
            {% set offset = 3.24 %}

            {% set t_raw_k = (raw | float) + 273.15 %}
            {% set t_amb_k = (amb | float) + 273.15 %}
            {% set numer    = t_raw_k**4 - (1-ε)*t_amb_k**4 %}
            {% set t_skin_k = (numer/ε)**0.25 %}
            {% set t_skin_c = t_skin_k - 273.15 %}

            {{ ((a + b * t_skin_c) - offset) | round(1) }}
          {% endif %}

        attribute_templates:
          core_before_offset:
            friendly_name: "Core Temp Before Offset"
            unit_of_measurement: "°C"
            value_template: >-
              {% if raw not in invalid and amb not in invalid %}
                {{ (15.87 + 0.655 * ( ( ( ( (raw|float)+273.15 )**4
                     - (1-0.98)*( (amb|float)+273.15 )**4 )/0.98 )**0.25
                     - 273.15 ) ) | round(1) }}
              {% else %}
                unavailable
              {% endif %}

          calibration_method: "a + b·T_skin – offset"
          calibration_coefficients: "a=15.87, b=0.655"
          offset: "-3.24 °C"
          emissivity: "0.98"
          stefan_boltzmann_constant: "5.670374419e-8"
