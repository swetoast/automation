sensor:
  - platform: template
    sensors:
      withings_thermo_calibrated_temperature:
        friendly_name: "Withings Thermo Calibrated Temperature"
        device_class: temperature
        unit_of_measurement: "°C"

        value_template: >-
          {% set raw_str = states('sensor.withings_body_temperature') %}
          {% set amb_str = states('sensor.withings_temperature') %}
          {% set invalid = ['unknown', 'unavailable', 'None'] %}

          {% if raw_str in invalid or amb_str in invalid %}
            unavailable
          {% else %}
            {% set ε = 0.98 %}
            {% set a = 15.87 %}
            {% set b = 0.655 %}
            {% set offset = 3.4 %}
            {% set t_raw_k = (raw_str | float) + 273.15 %}
            {% set t_amb_k = (amb_str | float) + 273.15 %}
            {% set numer    = t_raw_k**4 - (1 - ε) * t_amb_k**4 %}
            {% set t_skin_k = (numer / ε) ** 0.25 %}
            {% set t_skin_c = t_skin_k - 273.15 %}

            {{ ((a + b * t_skin_c) - offset) | round(1) }}
          {% endif %}

        attribute_templates:
          raw_ir_temp:
            friendly_name: "Raw IR Temp"
            unit_of_measurement: "°C"
            value_template: "{{ states('sensor.withings_body_temperature') }}"

          ambient_temp:
            friendly_name: "Ambient Temp"
            unit_of_measurement: "°C"
            value_template: "{{ states('sensor.withings_temperature') }}"

          corrected_skin_temp:
            friendly_name: "Corrected Skin Temp"
            unit_of_measurement: "°C"
            value_template: >-
              {% set raw_str = states('sensor.withings_body_temperature') %}
              {% set amb_str = states('sensor.withings_temperature') %}
              {% set invalid = ['unknown','unavailable','None'] %}
              {% if raw_str not in invalid and amb_str not in invalid %}
                {% set ε = 0.98 %}
                {% set t_raw_k = (raw_str | float) + 273.15 %}
                {% set t_amb_k = (amb_str | float) + 273.15 %}
                {% set numer    = t_raw_k**4 - (1 - ε) * t_amb_k**4 %}
                {% set t_skin_k = (numer / ε) ** 0.25 %}
                {{ (t_skin_k - 273.15) | round(1) }}
              {% else %}
                unavailable
              {% endif %}

          raw_mapped_core_temp:
            friendly_name: "Core Temp Before Offset"
            unit_of_measurement: "°C"
            value_template: >-
              {% set raw_str = states('sensor.withings_body_temperature') %}
              {% set amb_str = states('sensor.withings_temperature') %}
              {% set invalid = ['unknown','unavailable','None'] %}
              {% if raw_str not in invalid and amb_str not in invalid %}
                {% set ε = 0.98 %}
                {% set a = 15.87 %}
                {% set b = 0.655 %}
                {% set t_raw_k = (raw_str | float) + 273.15 %}
                {% set t_amb_k = (amb_str | float) + 273.15 %}
                {% set numer    = t_raw_k**4 - (1 - ε) * t_amb_k**4 %}
                {% set t_skin_k = (numer / ε) ** 0.25 %}
                {% set t_skin_c = t_skin_k - 273.15 %}
                {{ (a + b * t_skin_c) | round(1) }}
              {% else %}
                unavailable
              {% endif %}
